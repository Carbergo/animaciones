<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Animaciones</title>

    <style>
        body {
            margin: 0;
            background: #A4ED8A;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .video-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
            color: #222;
        }

        p {
            margin-top: 10px;
            color: #333;
            font-size: 18px;
        }

        video {
            width: 45vw;
            max-width: 750px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <div class="video-container">
        <h2 style="color:black;">Cambiando el hexágono</h2>

        <video autoplay loop muted playsinline>
            <source src="Animacion1.mp4" type="video/mp4">
        </video>

        <p style="color:black;">P1-P6 Puntos del hexagono<br> X,F,Z puntos de intersección de lados opuestos</p>
    </div>

    <div class="video-container">
        <h2 style="color:black;">Cambiando la elipse</h2>

        <video autoplay loop muted playsinline>
            <source src="Animacion2.mp4" type="video/mp4">
        </video>

        <p style="color:black;">P1-P6 Puntos del hexagono<br> X,F,Z puntos de intersección de lados opuestos</p>
    </div>

</body>
</html>
</html>
