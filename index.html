<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Animaciones</title>

    <style>
        body {
            margin: 0;
            background: #A4ED8A;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .video-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h2 {
            color: black;
            font-size: 48px;
            font-weight: bold;
            text-decoration: underline;
            text-decoration-thickness: 4px;
            text-underline-offset: 8px;
            margin-bottom: 15px;
        }

        p {
            margin-top: 15px;
            color: black;
            font-size: 22px;
            line-height: 1.5;
        }

        video {
            width: 45vw;
            max-width: 750px;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <div class="video-container">

        <h2>
            Cambiando el hexágono
        </h2>

        <video autoplay loop muted playsinline>
            <source src="Animacion1.mp4" type="video/mp4">
        </video>

        <p>
            P1-P6 puntos del hexágono<br>
            Y, F, Z puntos de intersección de lados opuestos
        </p>

    </div>

    <div class="video-container">

        <h2>
            Cambiando la elipse
        </h2>

        <video autoplay loop muted playsinline>
            <source src="Animacion2.mp4" type="video/mp4">
        </video>

        <p>
            P1-P6 puntos del hexágono<br>
            Y, F, Z puntos de intersección de lados opuestos
        </p>

    </div>

</body>
</html>
